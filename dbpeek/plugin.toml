id          = "fuiyooo/dbpeek"
name        = "DB Peek"
version     = "0.2.0"
plugin_api  = 30
author      = "Fuiyooo"
license     = "MIT"
icon        = "database"
description = "Database browser overlay: pick a connection, browse databases, tables and rows, search every column, and run read-only SQL — MySQL, PostgreSQL and SQLite, powered by a small Go engine."
repository  = "https://github.com/Fuiyooo/noctalia-gomysql-peek"
tags        = ["Database", "Panel", "Bar", "Development"]

[[setting]]
key             = "engine_path"
type            = "file"
label_key       = "settings.engine_path.label"
description_key = "settings.engine_path.description"
default         = "~/.local/bin/dbpeek-engine"

[[setting]]
key             = "connections_file"
type            = "file"
label_key       = "settings.connections_file.label"
description_key = "settings.connections_file.description"
default         = ""

[[setting]]
key             = "page_size"
type            = "int"
label_key       = "settings.page_size.label"
description_key = "settings.page_size.description"
default         = 50
min             = 10
max             = 500

[[panel]]
id                      = "peek"
entry                   = "panel.luau"
width                   = 1180
height                  = 760
placement               = "floating"
position                = "center"
layer                   = "overlay"
keyboard_focus          = "exclusive"
dismiss_on_outside_click = true
capture_keys = [
  "Up", "Down", "Left", "Right",
  "Prior", "Next", "Home", "End",
  "Return", "BackSpace",
  "n", "e", "d", "q", "w", "r", "y", "slash", "shift+R",
]

[[widget]]
id    = "bar"
entry = "widget.luau"
